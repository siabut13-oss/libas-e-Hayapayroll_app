<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libas-e-Haya Staff Payroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@500&display=swap" rel="stylesheet">
<style>
/* Concept: a pendant lamp lights a frosted-glass card in a dark room. Dark UI by design. */
:root{
  color-scheme:dark;
  --bg:#06090B; --ink:#EAF1EE; --muted:#8FA39C; --line:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.14);
  --lamp:#FFC766; --lamp-soft:rgba(255,199,102,.35); --teal:#3FD0B6; --teal-ink:#04211C;
  --good:#6FD39D; --good-bg:rgba(111,211,157,.16); --warn:#F3C469; --warn-bg:rgba(243,196,105,.16);
  --bad:#FF9C9C; --bad-bg:rgba(255,120,120,.16);
  --display:'Fraunces',Georgia,serif; --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* background light + drifting colour */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
.b1{width:360px;height:360px;background:#0E6B5C;left:-120px;top:38%}
.b2{width:320px;height:320px;background:#6B4A12;right:-110px;top:62%;animation-delay:-6s}
.halo{position:absolute;left:50%;top:60px;width:760px;height:760px;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(255,199,102,.22),rgba(255,199,102,0) 62%);transition:opacity 1.2s var(--ease);opacity:0}
body.lit .halo{opacity:1}
@keyframes drift{to{transform:translate(40px,-50px) scale(1.15)}}

.wrap{max-width:440px;margin:0 auto;position:relative;display:flex;flex-direction:column;gap:16px}

/* lamp */
.lamp{position:relative;height:146px;display:flex;justify-content:center;margin-bottom:-6px}
.wire{position:absolute;top:0;left:50%;width:2px;height:62px;background:linear-gradient(#222,#6a7774);transform:translateX(-50%)}
.shade{position:absolute;top:60px;left:50%;width:104px;height:50px;transform:translateX(-50%);
  background:linear-gradient(180deg,#34443f,#121c19);clip-path:polygon(24% 0,76% 0,100% 100%,0 100%)}
.bulb{position:absolute;top:106px;left:50%;width:40px;height:18px;transform:translateX(-50%);border-radius:0 0 50% 50%;
  background:#3a3426;transition:background .5s,box-shadow .5s}
body.lit .bulb{background:#FFE2A6;box-shadow:0 0 22px 8px rgba(255,199,102,.85),0 0 90px 30px rgba(255,199,102,.45)}
.cone{position:absolute;top:116px;left:50%;width:min(560px,130vw);height:560px;transform:translateX(-50%);pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(255,199,102,.34),rgba(255,199,102,0) 88%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);
  filter:blur(8px);opacity:0;transition:opacity 1s var(--ease)}
body.lit .cone{opacity:1}
body.flicker .bulb,body.flicker .cone{animation:flick .9s steps(1) 1}
@keyframes flick{0%{opacity:.2}12%{opacity:1}22%{opacity:.25}34%{opacity:.9}44%{opacity:.4}60%{opacity:1}100%{opacity:1}}
.pull{position:absolute;top:84px;left:calc(50% + 46px);width:32px;height:64px;background:none;border:0;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center}
.pull i{width:1.5px;height:42px;background:#7d8b87;transition:height .15s}
.pull b{width:10px;height:10px;border-radius:50%;background:var(--lamp);box-shadow:0 0 10px var(--lamp-soft)}
.pull:active i{height:52px}
.pull:focus-visible{outline:2px solid var(--teal);border-radius:8px}

.brand{text-align:center;position:relative;z-index:1}
.brand .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* glass */
.glass{position:relative;z-index:1;border-radius:18px;padding:22px;overflow:hidden;
  background:linear-gradient(145deg,var(--glass-hi),var(--glass) 45%,rgba(255,255,255,.03));
  border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.glass::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);transform:skewX(-18deg);transition:left .9s var(--ease);pointer-events:none}
.glass:hover::after{left:130%}
.enter{opacity:0;transform:translateY(18px) scale(.985);animation:rise .8s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}

h1{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.lead{margin:0 0 20px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:16px}

/* floating-label fields */
.field{position:relative}
.field input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--line);
  border-radius:12px;padding:22px 14px 8px;transition:border-color .25s,box-shadow .25s,background .25s}
.field label{position:absolute;left:15px;top:15px;color:var(--muted);font-size:15px;pointer-events:none;transform-origin:left top;transition:transform .25s var(--ease),color .25s}
.field input:focus,.field input:not(:placeholder-shown){}
.field input:focus ~ label,.field input:not(:placeholder-shown) ~ label{transform:translateY(-9px) scale(.76)}
.field input:focus{outline:0;border-color:var(--lamp);background:rgba(0,0,0,.4);box-shadow:0 0 0 3px rgba(255,199,102,.18),0 0 24px rgba(255,199,102,.18)}
.field input:focus ~ label{color:var(--lamp)}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}

/* button */
.btn{--mx:50%;--my:50%;position:relative;overflow:hidden;font:inherit;font-weight:600;font-size:16px;border:0;border-radius:12px;cursor:pointer;
  padding:15px 18px;color:var(--teal-ink);background:linear-gradient(180deg,#5FE3CB,var(--teal));
  box-shadow:0 8px 24px rgba(63,208,182,.28);transition:transform .2s var(--ease),box-shadow .3s}
.btn::before{content:"";position:absolute;inset:0;background:radial-gradient(160px circle at var(--mx) var(--my),rgba(255,255,255,.65),transparent 60%);opacity:0;transition:opacity .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(63,208,182,.42)}
.btn:hover::before{opacity:.6}
.btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn[disabled]{cursor:wait}
.btn span{position:relative}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(4,33,28,.3);border-top-color:var(--teal-ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--bad-bg);color:var(--bad);border:1px solid rgba(255,120,120,.3);padding:10px 12px;border-radius:10px;font-size:14px;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:6px 2px;text-decoration:underline}
.link:hover{color:var(--ink)}

/* slip */
.stack{display:flex;flex-direction:column;gap:16px}
.person{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.person h2{font-family:var(--display);font-weight:500;font-size:24px;margin:0;line-height:1.2}
.person p{margin:3px 0 0;color:var(--muted);font-size:13px}
.person p b{color:var(--ink);font-weight:600}
.chips{position:relative;z-index:1;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;transition:all .25s var(--ease)}
.chip:hover{border-color:var(--lamp)}
.chip[aria-pressed="true"]{background:var(--lamp);color:#2a1c00;border-color:var(--lamp);box-shadow:0 0 20px var(--lamp-soft)}
.chip:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.net{box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18),0 0 60px rgba(255,199,102,.12)}
.net .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.net .v{font-family:var(--display);font-weight:600;font-size:46px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;
  text-shadow:0 0 28px rgba(255,199,102,.35)}
.net .v i{font-style:normal;font-family:var(--body);font-weight:500;font-size:16px;color:var(--muted);margin-right:8px;text-shadow:none}
.row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px;white-space:nowrap}
.pill.paid{background:var(--good-bg);color:var(--good)}
.pill.pending{background:var(--warn-bg);color:var(--warn)}
.pill.hold{background:var(--bad-bg);color:var(--bad)}
.meta{font-size:13px;color:var(--muted);margin:8px 0 0}
.sec h3{margin:0 0 6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
dl{margin:0;display:grid;grid-template-columns:1fr auto}
dt,dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
dd{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
dt small{display:block;color:var(--muted);font-size:12px}
dt.tot,dd.tot{border-bottom:0;font-weight:600;padding-top:14px}
dd.tot{color:var(--lamp)}
.zero{color:var(--muted);font-weight:400}
.foot{text-align:center;font-size:12px;color:var(--muted);position:relative;z-index:1}

/* logo medallion */
.medal{position:relative;z-index:1;width:108px;height:108px;margin:0 auto;border-radius:50%;display:grid;place-items:center}
.medal::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 50%,var(--lamp) 80%,#fff 88%,transparent 100%);animation:spin 6s linear infinite}
.medal .face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.28),rgba(255,255,255,.06) 55%,rgba(0,0,0,.3));
  border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 46px rgba(255,199,102,.28)}
.medal svg{position:relative;width:72px;height:72px;overflow:visible;animation:floaty 5s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,199,102,.5))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{50%{transform:translateY(-4px)}}
.arch,.hem{fill:none;stroke:url(#gold);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s var(--ease) forwards .5s}
.arch{stroke-width:3}.a2{stroke-width:1.6;animation-delay:1s}
.hem{stroke-width:2.2;animation-delay:1.5s}
@keyframes draw{to{stroke-dashoffset:0}}
.moon,.star{transform-box:fill-box;transform-origin:center;opacity:0}
.moon{animation:pop .9s var(--ease) forwards 1.3s}
.star{animation:pop .7s var(--ease) forwards 1.9s,twinkle 3s ease-in-out 2.8s infinite}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-50deg)}to{opacity:1;transform:none}}
@keyframes twinkle{50%{transform:scale(1.35) rotate(20deg);filter:brightness(1.4)}}
.logo.still *{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}
.logo.still{animation:none;filter:none}
.word{display:block;font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:.4px;line-height:1.2;
  background:linear-gradient(90deg,#EAF1EE 0%,#EAF1EE 35%,#FFE2A6 50%,#EAF1EE 65%,#EAF1EE 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
@keyframes shim{from{background-position:130% 0}to{background-position:-130% 0}}
.ur{display:block;font-family:'Noto Nastaliq Urdu',serif;font-size:19px;line-height:2;color:var(--lamp);text-shadow:0 0 18px var(--lamp-soft)}
.brand{margin-top:10px}

/* glass orbs and spotlight */
.orb{position:absolute;transform:translate(calc(var(--px,0) * var(--k) * 1px),calc(var(--py,0) * var(--k) * 1px));transition:transform .5s var(--ease)}
.orb i{display:block;width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.02) 60%);
  border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 30px rgba(0,0,0,.35);animation:bob 9s ease-in-out infinite alternate}
.o1{width:96px;height:96px;right:6%;top:26%;--k:-14}
.o2{width:56px;height:56px;left:7%;top:56%;--k:20}.o2 i{animation-duration:7s;animation-delay:-3s}
.o3{width:140px;height:140px;right:-30px;top:72%;--k:-26}.o3 i{animation-duration:11s;animation-delay:-5s}
@keyframes bob{to{transform:translateY(-22px) scale(1.06)}}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(260px circle at var(--gx,50%) var(--gy,-20%),rgba(255,255,255,.16),transparent 65%);transition:opacity .3s}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.mini svg{width:46px;height:46px;display:block;filter:drop-shadow(0 0 6px rgba(255,199,102,.5))}

.medal{width:156px;height:156px;display:block}
.disc{position:absolute;inset:3px;border-radius:50%;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.55),0 0 60px rgba(255,199,102,.4),0 18px 40px rgba(0,0,0,.5)}
.disc img{width:100%;height:100%;display:block;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,199,102,.5) 50%,transparent 62%);transform:translateX(-130%);animation:sweep 6s ease-in-out 2.2s infinite}
@keyframes sweep{0%{transform:translateX(-130%)}35%,100%{transform:translateX(130%)}}
.brand{margin-top:6px}
.mini img{width:48px;height:48px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.5),0 0 16px rgba(255,199,102,.4)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg"><div class="halo"></div><div class="blob b1"></div><div class="blob b2"></div><div class="orb o1"><i></i></div><div class="orb o2"><i></i></div><div class="orb o3"><i></i></div></div>
<div class="wrap">
  <div class="lamp">
    <div class="wire"></div><div class="shade"></div><div class="bulb"></div><div class="cone"></div>
    <button class="pull" id="pull" type="button" aria-label="Switch the lamp on or off" aria-pressed="false"><i></i><b></b></button>

  <div class="brand enter" style="--d:.3s"><span class="sub">Staff payroll portal</span></div>

  <section id="login" class="glass enter" style="--d:.45s">
    <h1>Check your salary</h1>
    <p class="lead">Enter your employee code and the last 4 digits of your CNIC.</p>
    <form id="form" autocomplete="off">
      <div class="field">
        <input id="code" name="code" required autocapitalize="characters" autocomplete="off" placeholder=" ">
        <label for="code">Employee code</label>
        <div class="hint">Example: LH-001</div>
      </div>
      <div class="field">
        <input id="pin" name="pin" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" type="password" placeholder=" ">
        <label for="pin">PIN (last 4 digits of CNIC)</label>
      </div>
      <div id="err" class="err" role="alert" hidden></div>
      <button id="go" class="btn" type="submit"><span id="goTxt">View my salary slip</span></button>
    </form>
  </section>

  <div id="slipView" class="stack" hidden>
    <section class="glass person enter">
      <div class="who"><span class="mini" id="mini"></span><div><h2 id="pName"></h2><p id="pRole"></p><p>Code <b id="pCode"></b></p></div></div>
      <button id="out" class="link" type="button">Log out</button>
    </section>
    <div id="chips" class="chips enter" style="--d:.1s" role="group" aria-label="Choose month"></div>
    <div id="slip" class="stack"></div>
  </div>

  <div class="foot enter" style="--d:.7s">Your salary details are shown only after you enter your code and PIN.</div>
</div>

<script>
// Paste your Apps Script Web app URL here (the one ending in /exec).
var API_URL = "https://script.google.com/macros/s/AKfycby4sDhlQOjan6sL91MqISVhp2Vnee5W0Fjq6Z53ohQ28mlvdRA0adN-wym2NMmB91iMuQ/exec";

var $ = function(id){return document.getElementById(id)};
var data = null;
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* lamp */
function lamp(on, flicker){
  document.body.classList.toggle('lit', on);
  $('pull').setAttribute('aria-pressed', String(on));
  if(on && flicker && !reduce){ document.body.classList.remove('flicker'); void document.body.offsetWidth; document.body.classList.add('flicker'); }
}
$('pull').addEventListener('click', function(){ lamp(!document.body.classList.contains('lit'), true); });
setTimeout(function(){ lamp(true, true); }, 500);

document.addEventListener('pointermove', function(e){
  if(reduce) return;
  var x=e.clientX/window.innerWidth-.5, y=e.clientY/window.innerHeight-.5;
  document.body.style.setProperty('--px',x.toFixed(3)); document.body.style.setProperty('--py',y.toFixed(3));
  var g=e.target.closest&&e.target.closest('.glass');
  if(g){ var r=g.getBoundingClientRect(); g.style.setProperty('--gx',(e.clientX-r.left)+'px'); g.style.setProperty('--gy',(e.clientY-r.top)+'px'); }
});

function monthName(m){ var p=String(m).split('-'), i=parseInt(p[1],10)-1; return (p.length===2&&MONTHS[i])?MONTHS[i]+' '+p[0]:m; }
function showErr(msg){ var e=$('err'); e.hidden=!msg; e.textContent=msg; if(msg){ e.style.animation='none'; void e.offsetWidth; e.style.animation=''; } }

/* button: light follows the pointer, ripple on press */
var go=$('go');
go.addEventListener('pointermove', function(e){ var r=go.getBoundingClientRect(); go.style.setProperty('--mx',(e.clientX-r.left)+'px'); go.style.setProperty('--my',(e.clientY-r.top)+'px'); });
go.addEventListener('pointerdown', function(e){
  var r=go.getBoundingClientRect(), d=Math.max(r.width,r.height)*2, s=document.createElement('span');
  s.className='ripple'; s.style.width=s.style.height=d+'px'; s.style.left=(e.clientX-r.left-d/2)+'px'; s.style.top=(e.clientY-r.top-d/2)+'px';
  go.appendChild(s); setTimeout(function(){ s.remove(); }, 650);
});

function setBusy(b){
  go.disabled=b; var t=$('goTxt'); t.textContent=''; 
  if(b){ var sp=document.createElement('i'); sp.className='spin'; t.appendChild(sp); t.appendChild(document.createTextNode('Checking…')); }
  else t.textContent='View my salary slip';
}

$('form').addEventListener('submit', function(ev){
  ev.preventDefault();
  var code=$('code').value.trim(), pin=$('pin').value.trim();
  if(!/^\d{4}$/.test(pin)){ showErr('PIN must be exactly 4 digits.'); return; }
  showErr(''); setBusy(true);
  fetch(API_URL+'?code='+encodeURIComponent(code)+'&pin='+encodeURIComponent(pin))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok){ showErr('Employee code or PIN is not correct. Please check and try again.'); return; }
      data=j; render();
    })
    .catch(function(){ showErr('Could not reach the payroll sheet. Check your internet connection and try again.'); })
    .then(function(){ setBusy(false); });
});

$('out').addEventListener('click', function(){
  data=null; $('pin').value=''; $('slipView').hidden=true; $('login').hidden=false; $('code').focus();
});

function render(){
  $('login').hidden=true; var sv=$('slipView'); sv.hidden=false;
  $('pName').textContent=data.employee.name;
  $('pRole').textContent=data.employee.designation+' · '+data.employee.department;
  $('pCode').textContent=data.employee.code;
  var lg=document.createElement('img'); lg.src=$('logoImg').src; lg.alt=''; $('mini').textContent=''; $('mini').appendChild(lg);
  var chips=$('chips'); chips.textContent='';
  if(!data.slips.length){
    $('slip').textContent=''; var c=el('div','glass enter','No salary slips have been added for you yet.'); $('slip').appendChild(c); return;
  }
  data.slips.forEach(function(s,i){
    var b=el('button','chip',monthName(s.month)); b.type='button'; b.addEventListener('click',function(){ pick(i); }); chips.appendChild(b);
  });
  pick(0);
}

function pick(i){
  Array.prototype.forEach.call($('chips').children,function(c,k){ c.setAttribute('aria-pressed', k===i?'true':'false'); });
  var s=data.slips[i], box=$('slip'); box.textContent='';

  var net=el('section','glass net enter'); net.style.setProperty('--d','.05s');
  var r=el('div','row1'); r.appendChild(el('span','k','Net salary · '+monthName(s.month)));
  var st=s.status||'Pending', cls=st==='Paid'?'paid':(st==='On Hold'?'hold':'pending'); r.appendChild(el('span','pill '+cls,st));
  net.appendChild(r);
  var v=el('div','v'); v.appendChild(el('i','','PKR')); var num=el('span','',s.net); v.appendChild(num); net.appendChild(v);
  if(s.paymentDate) net.appendChild(el('div','meta','Paid on '+s.paymentDate));
  box.appendChild(net); countUp(num, s.net);

  var earn=el('section','glass sec enter'); earn.style.setProperty('--d','.18s'); earn.appendChild(el('h3','','Earnings'));
  earn.appendChild(list([['Basic salary',s.basic],['Allowances',s.allowances],['Overtime',s.otAmount,s.otHours+' hrs'],['Bonus',s.bonus],['Gross salary',s.gross,'',true]]));
  box.appendChild(earn);

  var ded=el('section','glass sec enter'); ded.style.setProperty('--d','.3s'); ded.appendChild(el('h3','','Deductions'));
  ded.appendChild(list([['Absence',s.absentDeduction,s.absentDays+' day(s)'],['Advance / loan',s.advance],['Tax / other',s.tax],['Total deductions',s.totalDeductions,'',true]]));
  box.appendChild(ded);

  if(s.remarks) box.appendChild(el('div','foot enter','Note: '+s.remarks));
}

function countUp(node, text){
  var target=parseFloat(String(text).replace(/,/g,'')); if(isNaN(target)||reduce){ return; }
  var t0=null, dur=900;
  function step(t){ if(t0===null) t0=t; var p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,3);
    node.textContent=Math.round(target*e).toLocaleString('en-US'); if(p<1) requestAnimationFrame(step); else node.textContent=text; }
  node.textContent='0'; requestAnimationFrame(step);
}
function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined&&text!=='') e.textContent=text; return e; }
function list(rows){
  var dl=document.createElement('dl');
  rows.forEach(function(r){
    var dt=el('dt',r[3]?'tot':'',r[0]); if(r[2]) dt.appendChild(el('small','',r[2]));
    var dd=el('dd',r[3]?'tot':''), z=(r[1]==='0'||r[1]===''); dd.appendChild(el('span',z?'zero':'',z?'0':r[1]));
    dl.appendChild(dt); dl.appendChild(dd);
  });
  return dl;
}
</script>
</body>
